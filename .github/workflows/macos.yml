name: macOS application build
on:
  workflow_dispatch:
  push:
    branches: [codex/research-workspace]
    paths: ['src/**', 'backend/**', 'frontend/**', 'desktop/**', 'scripts/**', 'pyproject.toml', '.github/workflows/macos.yml']
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/build_sidecar.py
      - run: python scripts/smoke_sidecar.py desktop/src-tauri/binaries/tripod-backend-${{ matrix.target }}
      - run: npm install
        working-directory: frontend
      - run: npm test && npm run build
        working-directory: frontend
      - run: cargo install tauri-cli --version '^2' --locked
      - run: cargo tauri build --locked
        working-directory: desktop/src-tauri
      - name: Record resolved toolchain
        run: |
          python -m pip freeze > build/python-freeze.txt
          rustc --version > build/rust-version.txt
          node --version > build/node-version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TRIPODCode-${{ matrix.target }}-unsigned
          path: |
            desktop/src-tauri/target/release/bundle
            desktop/src-tauri/Cargo.lock
            frontend/package-lock.json
            build/sidecar/build-manifest.json
            build/*-freeze.txt
            build/*-version.txt
