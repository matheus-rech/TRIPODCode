[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tripodcode-workspace"
version = "0.1.0"
description = "Local research workspace for TRIPODCode"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.12,<3", "pandas>=2.3,<3", "pyarrow>=19,<24",
  "openai>=2.14,<4", "tqdm>=4.67,<5", "tiktoken>=0.12,<1",
   "python-docx>=1.2,<2", "PyPDF2==3.0.1",
  "requests>=2.32,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "filelock>=3.20,<4", "keyring>=25,<26"
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "httpx>=0.28,<1", "build>=1,<2", "pyinstaller>=6.18,<7"]

[project.scripts]
tripod-workspace = "backend.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "backend*"]

[tool.setuptools.package-data]
"src.tripod" = ["fixtures/*.json", "build-info.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
